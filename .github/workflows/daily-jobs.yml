# Daily scrape from private scraper repo → commit data/ on this repo's main.
#
# Secrets (this repo → Settings → Secrets → Actions):
#   SCRAPER_TOKEN     — PAT/OAuth with read access to halleelyasaf/il-proxy-for-block-site
#   IL_UPSTREAM_PROXY — optional Israeli proxy for Rafael

name: Daily jobs update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Checkout scraper
        uses: actions/checkout@v4
        with:
          repository: halleelyasaf/il-proxy-for-block-site
          path: scraper
          token: ${{ secrets.SCRAPER_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape all companies
        working-directory: scraper
        env:
          IL_UPSTREAM_PROXY: ${{ secrets.IL_UPSTREAM_PROXY }}
        run: python update_all_jobs.py

      - name: Commit and push data/
        run: |
          set -euo pipefail
          mkdir -p data
          cp scraper/data/all_jobs_latest.json data/
          for f in scraper/data/*_jobs_latest.json; do
            base=$(basename "$f")
            [ "$base" = "all_jobs_latest.json" ] && continue
            cp "$f" "data/${base}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          DAY=$(date -u +%Y-%m-%d)
          COUNT=$(python -c "import json; print(json.load(open('data/all_jobs_latest.json'))['count'])")
          git commit -m "chore(jobs): update snapshot ${DAY} (${COUNT} jobs)"
          git push origin HEAD:main

          {
            echo "## Daily jobs update"
            echo "- **Total:** ${COUNT}"
            echo "- **Day:** ${DAY}"
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/all_jobs_latest.json").read_text())
          for k, v in (d.get("per_company") or {}).items():
              err = f" — {v.get('error')}" if v.get("error") else ""
              print(f"- `{k}`: {v.get('count')} ({v.get('source')}){err}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
